<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Assets — gallery</title>
    <style>
      :root {
        --bg: #09090b;
        --card: #0c0c0e;
        --line: rgba(255, 255, 255, 0.08);
        --fg: #fafafa;
        --muted: #71717a;
        --dim: #52525b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, sans-serif;
        padding: 48px 24px 96px;
      }
      .wrap { max-width: 1100px; margin: 0 auto; }
      header { margin-bottom: 40px; }
      h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
      .sub { color: var(--muted); margin-top: 8px; font-size: 14px; }
      .meta {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: var(--dim);
        margin-top: 14px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        display: inline-block;
      }
      .meta b { color: var(--muted); font-weight: 500; }
      figure {
        margin-top: 28px;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: var(--card);
      }
      figure img { display: block; width: 100%; height: auto; }
      figcaption {
        padding: 16px 20px;
        border-top: 1px solid var(--line);
      }
      .name {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        color: var(--fg);
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .name .dims { color: var(--dim); }
      .prompt {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        margin-top: 10px;
        max-width: 70ch;
      }
      .seed {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: var(--dim);
        margin-top: 10px;
      }
      .used {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(52, 211, 153, 0.3);
        color: #34d399;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        vertical-align: 1px;
      }
      .reserved {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        vertical-align: 1px;
      }
      hr { border: 0; border-top: 1px solid var(--line); margin: 48px 0 8px; }
      .footnote { color: var(--dim); font-size: 12px; margin-top: 12px; }
      a { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Generated visual assets</h1>
        <p class="sub">
          Six images rendered locally with Qwen Image 2.1 Turbo, then downscaled
          and palette-quantized for the web. Prompts and seeds are recorded so
          any image can be reproduced exactly.
        </p>
        <div class="meta">
          <b>model</b> qwen-image-2.1-turbo-Q5_0.gguf &nbsp;·&nbsp;
          <b>steps</b> 25 &nbsp;·&nbsp; <b>cfg</b> 1 &nbsp;·&nbsp;
          <b>sampler</b> euler/simple
        </div>
      </header>

            <figure>
        <img src="/ai/hero-layers.png" alt="hero-layers" loading="lazy" />
        <figcaption>
          <div class="name">
            <span>hero-layers.png<span class="reserved">reserved</span></span>
            <span class="dims">1400×583 · 195KB</span>
          </div>
          <p class="prompt">Wide panoramic abstract composition: strata of translucent horizontal plates stacked with slight offsets, like the cross-section of a memory core, thin amber threads of light running between the layers</p>
          <div class="seed">seed 1494121757 · generated 2026-10-10 19:30:28 · 126.7s</div>
        </figcaption>
      </figure>
      <figure>
        <img src="/ai/hero-backdrop.png" alt="hero-backdrop" loading="lazy" />
        <figcaption>
          <div class="name">
            <span>hero-backdrop.png<span class="used">in use</span></span>
            <span class="dims">1600×800 · 204KB</span>
          </div>
          <p class="prompt">Ultra-wide minimal abstract backdrop: dark room with a single soft amber light source behind layered vertical stone slabs, deep shadows, lots of empty negative space at the top, atmospheric haze</p>

      </figure>
      <figure>
        <img src="/ai/stack-diagram.png" alt="stack-diagram" loading="lazy" />

          <div class="name">
            <span>stack-diagram.png<span class="reserved">reserved</span></span>
            <span class="dims">1200×600 · 187KB</span>
          </div>
          <p class="prompt">Three distinct architectural blocks side by side connected by thin glowing lines, each block a different height, like a diagram of a three-layer system rendered as abstract brutalist architecture, dramatic side lighting</p>

        </figcaption>
      </figure>
      <figure>
        <img src="/ai/principle-veil.png" alt="principle-veil" loading="lazy" />
        <figcaption>
          <div class="name">
            <span>principle-veil.png<span class="reserved">reserved</span></span>
            <span class="dims">900×900 · 134KB</span>
          </div>
          <p class="prompt">Close-up abstract detail: edges of dark folded plates catching a thin amber rim light, geometric shadow play, shallow depth of field, quiet and contemplative mood, heavy vignette</p>
          <div class="seed">seed 414106050 · generated 2026-10-10 19:38:40 · 132.7s</div>
        </figcaption>
      </figure>
      <figure>
        <img src="/ai/cta-arch.png" alt="cta-arch" loading="lazy" />

          <div class="name">
            <span>cta-arch.png<span class="reserved">reserved</span></span>
            <span class="dims">1200×600 · 141KB</span>
          </div>
          <p class="prompt">A solitary monolithic archway of dark stone with warm amber light pouring through the opening, symmetrical, vast dark space around it, cinematic and monumental, minimal, empty plaza in the foreground</p>
          <div class="seed">seed 1626040315 · generated 2026-10-10 19:41:05 · 144.8s</div>
        </figcaption>
      </figure>
      <figure>
        <img src="/ai/footer-strata.png" alt="footer-strata" loading="lazy" />
        <figcaption>
          <div class="name">
            <span>footer-strata.png<span class="reserved">reserved</span></span>
            <span class="dims">1600×300 · 76KB</span>
          </div>
          <p class="prompt">Horizontal band of dark geological strata with hairline amber seams, very dark overall, mostly shadow, quiet texture for a footer band</p>
          <div class="seed">seed 1938232934 · generated 2026-10-10 19:42:56 · 111.5s</div>
        </figcaption>
      </figure>
    </div>
  </body>
</html>
