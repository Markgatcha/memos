<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
  <defs>
    <linearGradient id="bgfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="14" fill="url(#bgfade)" stroke="#26262c"/>

  <!-- window bar -->
  <circle cx="28" cy="26" r="6" fill="#3f3f46"/>
  <circle cx="48" cy="26" r="6" fill="#3f3f46"/>
  <circle cx="68" cy="26" r="6" fill="#3f3f46"/>
  <text x="400" y="31" text-anchor="middle" font-size="13" fill="#52525b">memory survives restarts</text>
  <circle cx="756" cy="26" r="4" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="744" y="31" text-anchor="end" font-size="11" fill="#10b981" opacity="0.8">local</text>
  <line x1="0" y1="46" x2="800" y2="46" stroke="#26262c"/>

  <!-- Scene 1: store (0-4s) -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.3;0.34;0.62;0.66;0.96;1" dur="12s" repeatCount="indefinite"/>
    <text x="32" y="86" font-size="15" fill="#71717a">$</text>
    <text x="52" y="86" font-size="15" fill="#e4e4e7">memos add "user prefers dark mode, deploys on Fridays"</text>
    <text x="32" y="122" font-size="15" fill="#10b981">✓ stored · memory #848 · trust 0.92</text>
    <text x="32" y="170" font-size="13" fill="#52525b">→ written to ~/.memos/memos.db (plain SQLite, yours to keep)</text>
  </g>

  <!-- Scene 2: kill + restart (4-8s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.3;0.34;0.62;0.66;0.96;1" dur="12s" repeatCount="indefinite"/>
    <text x="32" y="86" font-size="15" fill="#71717a">$</text>
    <text x="52" y="86" font-size="15" fill="#e4e4e7">kill -9 $AGENT_PID</text>
    <text x="32" y="122" font-size="15" fill="#71717a">process terminated. conversation gone.</text>
    <text x="32" y="170" font-size="15" fill="#71717a">$</text>
    <text x="52" y="170" font-size="15" fill="#e4e4e7">agent start</text>
    <text x="72" y="200" font-size="13" fill="#52525b">fresh process · 0 messages in context</text>
  </g>

  <!-- Scene 3: recall (8-12s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.3;0.34;0.62;0.66;0.96;1" dur="12s" repeatCount="indefinite"/>
    <text x="32" y="86" font-size="15" fill="#71717a">$</text>
    <text x="52" y="86" font-size="15" fill="#e4e4e7">memos recall "what does the user prefer?"</text>
    <text x="32" y="126" font-size="15" fill="#7dd3fc">→ "user prefers dark mode, deploys on Fridays"</text>
    <text x="32" y="162" font-size="15" fill="#10b981">✓ recalled in 14ms · sqlite · 0 cloud calls</text>
  </g>

  <!-- progress dots -->
  <g>
    <rect x="368" y="380" width="24" height="4" rx="2" fill="#a1a1aa">
      <animate attributeName="opacity" values="1;1;0.25;0.25;0.25;0.25;1" keyTimes="0;0.3;0.34;0.62;0.66;0.96;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="380" width="24" height="4" rx="2" fill="#3f3f46">
      <animate attributeName="fill" values="#3f3f46;#3f3f46;#a1a1aa;#a1a1aa;#3f3f46;#3f3f46;#3f3f46" keyTimes="0;0.3;0.34;0.62;0.66;0.96;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="432" y="380" width="24" height="4" rx="2" fill="#3f3f46">
      <animate attributeName="fill" values="#3f3f46;#3f3f46;#3f3f46;#3f3f46;#a1a1aa;#a1a1aa;#3f3f46" keyTimes="0;0.3;0.34;0.62;0.66;0.96;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="32" y="388" font-size="11" fill="#3f3f46">MemOS — local-first memory for AI agents</text>
  <text x="768" y="388" text-anchor="end" font-size="11" fill="#3f3f46">loops · no cloud · MIT</text>
</svg>
