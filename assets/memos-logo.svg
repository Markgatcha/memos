<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48cfad;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="#6c63ff" stroke-width="2"/>

  <!-- faint background constellation -->
  <g stroke="#ffffff" opacity="0.07" stroke-width="1">
    <line x1="30" y1="42" x2="52" y2="30"/>
    <line x1="52" y1="30" x2="66" y2="44"/>
    <line x1="170" y1="52" x2="150" y2="38"/>
    <line x1="150" y1="38" x2="138" y2="54"/>
    <line x1="34" y1="150" x2="50" y2="160"/>
    <line x1="166" y1="146" x2="152" y2="158"/>
  </g>
  <g fill="#ffffff" opacity="0.12">
    <circle cx="30" cy="42" r="1.5"/>
    <circle cx="52" cy="30" r="1.2"/>
    <circle cx="66" cy="44" r="1.5"/>
    <circle cx="170" cy="52" r="1.5"/>
    <circle cx="150" cy="38" r="1.2"/>
    <circle cx="138" cy="54" r="1.5"/>
    <circle cx="34" cy="150" r="1.5"/>
    <circle cx="50" cy="160" r="1.2"/>
    <circle cx="166" cy="146" r="1.5"/>
    <circle cx="152" cy="158" r="1.2"/>
  </g>

  <!-- detailed brain: lobes, folds, neural graph -->
  <g transform="translate(100,84)">
    <!-- hemispheres -->
    <path d="M-10,-34 C-42,-40 -56,-24 -52,-8 C-56,4 -50,18 -36,25 C-26,30 -14,27 -10,22 Z"
      fill="none" stroke="url(#brain)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10,-34 C42,-40 56,-24 52,-8 C56,4 50,18 36,25 C26,30 14,27 10,22 Z"
      fill="none" stroke="url(#brain)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- brainstem -->
    <path d="M0,22 C0,28 2,32 6,35" fill="none" stroke="url(#brain)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="7" cy="36" r="2.5" fill="#a78bfa"/>

    <!-- central fissure stem -->
    <line x1="0" y1="-34" x2="0" y2="22" stroke="url(#brain)" stroke-width="2.2" opacity="0.9"/>

    <!-- gyri folds: left -->
    <g fill="none" stroke="#6c63ff" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <path d="M-36,-26 C-28,-22 -30,-12 -38,-10"/>
      <path d="M-44,-4 C-36,-2 -34,6 -44,10"/>
      <path d="M-24,-16 C-18,-10 -22,0 -30,4"/>
    </g>
    <!-- gyri folds: right -->
    <g fill="none" stroke="#48cfad" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <path d="M36,-26 C28,-22 30,-12 38,-10"/>
      <path d="M44,-4 C36,-2 34,6 44,10"/>
      <path d="M24,-16 C18,-10 22,0 30,4"/>
    </g>

    <!-- neural graph edges: left -->
    <g stroke="#6c63ff" stroke-width="1.1" opacity="0.45">
      <line x1="-38" y1="-26" x2="-16" y2="-36"/>
      <line x1="-38" y1="-26" x2="-48" y2="-6"/>
      <line x1="-48" y1="-6" x2="-30" y2="16"/>
      <line x1="-24" y1="-14" x2="-38" y2="-26"/>
      <line x1="-24" y1="-14" x2="-14" y2="4"/>
    </g>
    <!-- neural graph edges: right -->
    <g stroke="#48cfad" stroke-width="1.1" opacity="0.45">
      <line x1="38" y1="-26" x2="16" y2="-36"/>
      <line x1="38" y1="-26" x2="48" y2="-6"/>
      <line x1="48" y1="-6" x2="30" y2="16"/>
      <line x1="24" y1="-14" x2="38" y2="-26"/>
      <line x1="24" y1="-14" x2="14" y2="4"/>
    </g>
    <!-- neural graph edges: cross-hemisphere via the stem -->
    <g stroke="#a78bfa" stroke-width="1.1" opacity="0.5">
      <line x1="-16" y1="-36" x2="0" y2="-38"/>
      <line x1="16" y1="-36" x2="0" y2="-38"/>
      <line x1="-14" y1="4" x2="0" y2="-12"/>
      <line x1="14" y1="4" x2="0" y2="-12"/>
      <line x1="-30" y1="16" x2="0" y2="14"/>
      <line x1="30" y1="16" x2="0" y2="14"/>
    </g>

    <!-- neural nodes: left lobe -->
    <circle cx="-38" cy="-26" r="3.5" fill="#6c63ff"/>
    <circle cx="-16" cy="-36" r="2.5" fill="#6c63ff" opacity="0.85"/>
    <circle cx="-48" cy="-6" r="3" fill="#6c63ff" opacity="0.9"/>
    <circle cx="-30" cy="16" r="4" fill="#6c63ff"/>
    <circle cx="-14" cy="4" r="2.5" fill="#a78bfa"/>
    <circle cx="-24" cy="-14" r="2" fill="#6c63ff" opacity="0.7"/>
    <!-- neural nodes: right lobe -->
    <circle cx="38" cy="-26" r="3.5" fill="#48cfad"/>
    <circle cx="16" cy="-36" r="2.5" fill="#48cfad" opacity="0.85"/>
    <circle cx="48" cy="-6" r="3" fill="#48cfad" opacity="0.9"/>
    <circle cx="30" cy="16" r="4" fill="#48cfad"/>
    <circle cx="14" cy="4" r="2.5" fill="#a78bfa"/>
    <circle cx="24" cy="-14" r="2" fill="#48cfad" opacity="0.7"/>
    <!-- neural nodes: center stem -->
    <circle cx="0" cy="-38" r="4" fill="#a78bfa"/>
    <circle cx="0" cy="-12" r="3" fill="#6c63ff" opacity="0.9"/>
    <circle cx="0" cy="14" r="3" fill="#48cfad" opacity="0.9"/>
  </g>

  <text x="100" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle"
    letter-spacing="3">MemOS</text>
  <text x="100" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#6c63ff" text-anchor="middle" letter-spacing="1">MEMORY LAYER</text>
</svg>
