<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#48cfad;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="#6c63ff" stroke-width="2"/>

  <!-- memory thread: one memory traced through the layers -->
  <line x1="100" y1="62" x2="100" y2="136" stroke="#6c63ff" stroke-width="2.5" stroke-dasharray="6 9" opacity="0.55"/>

  <!-- vertical slab edges -->
  <g stroke="#6c63ff" stroke-width="2" opacity="0.35">
    <line x1="62" y1="80" x2="62" y2="124"/>
    <line x1="138" y1="80" x2="138" y2="124"/>
  </g>

  <!-- middle + bottom layers -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 108 L100 128 L138 108" stroke="#6c63ff" opacity="0.65"/>
    <path d="M62 130 L100 150 L138 130" stroke="#6c63ff" opacity="0.35"/>
  </g>

  <!-- top layer: the current memory graph -->
  <path d="M100 56 L138 80 L100 104 L62 80 Z" fill="#0f0f1a" fill-opacity="0.6" stroke="url(#brain)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- graph nodes: apex node on each layer, connected by the thread -->
  <circle cx="100" cy="56" r="9" fill="#48cfad" stroke="#0f0f1a" stroke-width="4"/>
  <circle cx="100" cy="128" r="6.5" fill="#6c63ff" stroke="#0f0f1a" stroke-width="3"/>
  <circle cx="100" cy="150" r="6.5" fill="#48cfad" stroke="#0f0f1a" stroke-width="3" opacity="0.85"/>

  <text x="100" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle"
    letter-spacing="3">MemOS</text>
  <text x="100" y="193" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#6c63ff" text-anchor="middle" letter-spacing="1">MEMORY LAYER</text>
</svg>
