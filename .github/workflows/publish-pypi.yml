name: Publish to PyPI

# Publishes the Python package (mem-os-sdk) to PyPI whenever a GitHub
# Release is published. Auth is a PyPI API token (PYPI_TOKEN secret),
# because Trusted Publishing (OIDC) has no project to bind to while
# mem-os-sdk doesn't exist on PyPI yet — the first token publish creates
# the project. Afterwards you can switch to OIDC by registering a trusted
# publisher on pypi.org (Owner Markgatcha / repo memos / workflow filename
# publish-pypi.yml / environment pypi) and dropping the password: input.
#
# Also supports workflow_dispatch for one-off retries (e.g. after rotating
# the token) without re-publishing the release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile TypeScript SDK
        run: pnpm build

      - name: Verify bundled SDK exists
        run: test -f dist/index.js

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          # Check the actual distributions only: dist/ also holds the
          # compiled-SDK subdirectory (dist/adapters) that the hatch bundle
          # hook stages, and twine chokes on directories in a bare glob.
          twine check dist/*.whl dist/*.tar.gz

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/*.whl
          # sdist is excluded on purpose: it would need the TS toolchain
          # to be useful, and the wheel is the supported install path.

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Token auth: the trusted-publishing (OIDC) exchange fails while
          # the mem-os-sdk project doesn't exist on PyPI yet — there is no
          # project for the OIDC claim to bind to. A token publish creates it.
          password: ${{ secrets.PYPI_TOKEN }}
