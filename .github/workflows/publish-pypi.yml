name: Publish to PyPI

# Publishes the Python package (mem-os-python) to PyPI whenever a GitHub
# Release is published. Auth uses PyPI Trusted Publishing (OIDC) — no API
# token secret is stored in the repo.
#
# PyPI-side setup (done once on pypi.org → project "mem-os-python" →
# Publishing → Add a publisher → GitHub):
#   - Owner:             Markgatcha
#   - Repository name:   memos
#   - Workflow name:     publish-pypi.yml
#   - Environment name:  pypi
#
# Also supports workflow_dispatch for one-off retries without having to
# re-publish the release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile TypeScript SDK
        run: pnpm build

      - name: Verify bundled SDK exists
        run: test -f dist/index.js

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          # Check the actual distributions only: dist/ also holds the
          # compiled-SDK subdirectory (dist/adapters) that the hatch bundle
          # hook stages, and twine chokes on directories in a bare glob.
          twine check dist/*.whl dist/*.tar.gz

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/*.whl
          # sdist is excluded on purpose: it would need the TS toolchain
          # to be useful, and the wheel is the supported install path.

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password input → the action uses Trusted Publishing (OIDC).
        # The OIDC claim must match the trusted publisher registered on
        # pypi.org (Owner Markgatcha / repo memos / workflow publish-pypi.yml
        # / environment pypi).
