name: Publish to PyPI

# Publishes the Python package (mem-os-sdk) to PyPI whenever a GitHub
# Release is published. Uses PyPI Trusted Publishing (OIDC) — no API
# token secret is stored in the repo.
#
# One-time setup (done in the PyPI UI, see README "Publishing" section):
#   1. On pypi.org, create the project "mem-os-sdk" (or a pending publisher)
#   2. Add a "trusted publisher":
#        - PyPI project:      mem-os-sdk
#        - Owner:             Markgatcha
#        - Repository:        memos
#        - Workflow filename: publish-pypi.yml
#        - Environment:       pypi
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Compile TypeScript SDK
        run: npm run build

      - name: Verify bundled SDK exists
        run: test -f dist/index.js

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/*.whl
          # sdist is excluded on purpose: it would need the TS toolchain
          # to be useful, and the wheel is the supported install path.

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
