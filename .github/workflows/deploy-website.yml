name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: |
          cd website
          npm ci

      - name: Type check
        run: |
          cd website
          npm run typecheck

      - name: Build
        run: |
          cd website
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

      # --- Option A: GitHub Pages (recommended) ---
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          publish_dir: website/out

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # --- Option B: gh-pages branch (fallback) ---
      # Uncomment if you prefer the gh-pages branch approach:
      # - name: Deploy to gh-pages branch
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./website/out
      #     cname: context-core.dev
