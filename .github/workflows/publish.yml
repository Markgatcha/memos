name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish @mem-os/sdk to npm
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check if version is already on npm
        id: npmcheck
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@mem-os/sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "@mem-os/sdk@${VERSION} already on npm — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npmcheck.outputs.skip != 'true'
        run: pnpm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISHER_TOKEN_LATEST }}
