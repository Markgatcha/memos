name: MemOS Desktop (GPUI)

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop-gpui/**"
      - ".github/workflows/desktop-gpui.yml"
  pull_request:
    paths:
      - "apps/desktop-gpui/**"
      - ".github/workflows/desktop-gpui.yml"
  workflow_dispatch:

concurrency:
  group: desktop-gpui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop-gpui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            libasound2-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop-gpui -> target"
          cache-on-failure: true

      - name: Prepare CI directories
        shell: bash
        run: mkdir -p "${RUNNER_TEMP}/memos-ci-logs" "${RUNNER_TEMP}/memos-desktop-home"

      - name: Run release Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --release --all-targets -- -D warnings 2>&1 | tee "${RUNNER_TEMP}/memos-ci-logs/clippy.log"

      - name: Run release library tests
        shell: bash
        env:
          MEMOS_DESKTOP_HOME: ${{ runner.temp }}/memos-desktop-home
        run: |
          set -o pipefail
          cargo test --release --lib 2>&1 | tee "${RUNNER_TEMP}/memos-ci-logs/lib-tests.log"

      - name: Run crash scrubber tests
        shell: bash
        env:
          MEMOS_DESKTOP_HOME: ${{ runner.temp }}/memos-desktop-home
        run: |
          set -o pipefail
          cargo test --release --test crash_scrubber 2>&1 | tee "${RUNNER_TEMP}/memos-ci-logs/crash-scrubber-tests.log"

      - name: Run headless smoke benchmarks
        shell: bash
        env:
          MEMOS_DESKTOP_HOME: ${{ runner.temp }}/memos-desktop-home
        run: |
          set -o pipefail
          cargo test --release --test smoke_bench -- --nocapture 2>&1 | tee "${RUNNER_TEMP}/memos-ci-logs/smoke-bench.log"

      - name: Build release desktop binary
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --bin memos-desktop 2>&1 | tee "${RUNNER_TEMP}/memos-ci-logs/release-build.log"

      - name: Run desktop self-test
        shell: bash
        env:
          MEMOS_DESKTOP_HOME: ${{ runner.temp }}/memos-desktop-home
        run: |
          set -o pipefail
          ./target/release/memos-desktop --self-test 2>&1 | tee "${RUNNER_TEMP}/memos-ci-logs/self-test.log"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-gpui-verify-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/memos-ci-logs
            ${{ runner.temp }}/memos-desktop-home/logs
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop-gpui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            libasound2-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop-gpui -> target"
          cache-on-failure: true

      - name: Prepare CI directories
        shell: bash
        run: mkdir -p "${RUNNER_TEMP}/memos-ci-logs"

      - name: Build release desktop binary
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --bin memos-desktop 2>&1 | tee "${RUNNER_TEMP}/memos-ci-logs/release-build.log"

      - name: Package .deb and .rpm (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb
          cargo generate-rpm

      - name: Package .app and .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./packaging/macos/build-dmg.sh

      - name: Package .msi (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install wixtoolset --yes --no-progress
          cargo install cargo-wix --locked
          cargo wix init
          cargo wix

      - name: Upload release binary and package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memos-desktop-${{ matrix.os }}
          path: |
            apps/desktop-gpui/target/release/memos-desktop
            apps/desktop-gpui/target/release/memos-desktop.exe
            apps/desktop-gpui/target/release/MemOS-Desktop.dmg
            apps/desktop-gpui/target/debian/*.deb
            apps/desktop-gpui/target/generate-rpm/*.rpm
            apps/desktop-gpui/target/wix/*.msi
          retention-days: 7
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-gpui-package-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/memos-ci-logs
          retention-days: 7
          if-no-files-found: ignore

  flatpak:
    name: Flatpak bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flatpak build tools and Flathub remote
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform/x86_64/25.08 \
            org.freedesktop.Sdk/x86_64/25.08 \
            org.freedesktop.Sdk.Extension.rust-stable/x86_64/25.08

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: memos-desktop.flatpak
          manifest-path: apps/desktop-gpui/packaging/flatpak/io.github.Markgatcha.memos.yml
          run-tests: false
          restore-cache: true
          cache-key: flatpak-builder-${{ hashFiles('apps/desktop-gpui/packaging/flatpak/cargo-sources.json') }}

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: memos-desktop-flatpak
          path: memos-desktop.flatpak
          retention-days: 7
          if-no-files-found: error
