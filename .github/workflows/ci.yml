name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # TypeScript: Lint + Format + Build + Test
  # ──────────────────────────────────────────────
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --ci --coverage

  semantic-search-cross-os:
    name: Semantic Search (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Embedding and hybrid search tests
        run: npm test -- --runInBand --testPathPatterns=memos.test.ts
      - name: Build
        run: npm run build

  linux-distro-native-smoke:
    name: Native deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            bootstrap: dnf install -y nodejs npm python3 make gcc-c++
          - name: Arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm nodejs npm python base-devel
          - name: openSUSE
            image: opensuse/tumbleweed:latest
            bootstrap: zypper -n install nodejs npm python3 gcc-c++ make
    steps:
      - uses: actions/checkout@v4
      - name: better-sqlite3 install/build/test smoke
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo ${{ matrix.image }} bash -lc '
            set -euxo pipefail
            ${{ matrix.bootstrap }}
            npm ci
            npm run typecheck
            npm test -- --runInBand --testPathPatterns=memos.test.ts
            npm run build
          '

  # ──────────────────────────────────────────────
  # Python: Lint + Test
  # ──────────────────────────────────────────────
  python:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Test
        run: pytest tests/ -v --tb=short
  # ──────────────────────────────────────────────
  # Docker build
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t memos:ci .
      - name: Verify container starts
        run: |
          docker run -d --name memos-test -p 7400:7400 memos:ci
          sleep 5
          curl -f http://localhost:7400/health
          docker stop memos-test
