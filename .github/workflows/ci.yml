name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Lockfile drift: fail fast if package-lock.json
  # is out of sync with package.json (catches the
  # class of break that previously wasted full runs).
  # ──────────────────────────────────────────────
  verify-lockfile:
    name: Verify lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Verify package-lock.json is in sync
        run: |
          # Use `npm ci --dry-run` rather than regenerating + diffing the
          # lockfile. It validates that package.json and package-lock.json are
          # in sync (the real failure mode) without byte-comparing the file,
          # so it does not false-positive on npm-version formatting differences
          # between the local machine and the CI runner.
          npm ci --dry-run

  # ──────────────────────────────────────────────
  # TypeScript: Lint + Format + Build + Test
  # Matrix: Node 26 (recommended) plus Node 22 and 24 (LTS) across
  # ubuntu/macOS/windows. Node 20 dropped (EOL Apr 2025).
  # ──────────────────────────────────────────────
  typescript:
    name: TypeScript (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: [verify-lockfile]
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          # No restore-keys prefix fallback: a prefix match restores a
          # node_modules built from a DIFFERENT lockfile. On Windows,
          # `npm ci` can then hit EPERM while deleting the stale tree and
          # run a stale package's install script (observed: old
          # better-sqlite3 v12 install script ran against a v13 lockfile
          # → node-gyp fallback → "no Visual Studio" failure). Exact-key
          # only: hit = matching tree, miss = clean install (tarballs are
          # still warm via the setup-node npm cache above).
      - name: Install dependencies
        run: npm ci
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: ${{ runner.os }}-huggingface-${{ hashFiles('package-lock.json') }}
      - name: Verify plugin manifest versions match the SDK
        run: node scripts/check-plugin-version.mjs
      - name: TypeScript version
        run: npx tsc --version
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --ci --coverage

  # ──────────────────────────────────────────────
  # Native deps smoke across major Linux distro
  # families (dnf/apt/pacman). Reduced from 6 to 3
  # to save CI minutes while covering all package
  # manager families.
  # Retrieval regression eval: the golden corpus (scripts/eval/corpus.json)
  # runs through the real hybrid pipeline on the deterministic local-hash
  # embedder; recall@5 / MRR must stay within tolerance of the committed
  # baseline. Catches ranking regressions (fusion, pools, expansion) before
  # they ship.
  retrieval-eval:
    name: Retrieval regression eval
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run retrieval eval against committed baseline
        run: npx tsx scripts/eval-retrieval.ts --check
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-eval-results
          path: scripts/eval/retrieval-results.json
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  linux-distro-native-smoke:
    name: Native deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            bootstrap: dnf install -y nodejs npm python3 make gcc-c++
          - name: Debian
            image: debian:trixie
            # Debian trixie ships Node 20, but better-sqlite3 v13 requires
            # Node >= 22 — install the NodeSource Node 24 LTS instead.
            bootstrap: apt-get update && apt-get install -y curl ca-certificates gnupg && curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && apt-get install -y nodejs python3 make g++
          - name: Arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm nodejs npm python base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Cache npm tarballs for in-docker install
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-cache-${{ hashFiles('package-lock.json') }}
      - name: better-sqlite3 install/build/test smoke
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ runner.temp }}/npm:/root/.npm" \
            -w /repo ${{ matrix.image }} bash -lc '${{ matrix.bootstrap }} && bash /repo/scripts/smoke-native.sh'

  # ──────────────────────────────────────────────
  # Python: Lint + Test
  # Matrix: 3.11, 3.12 (LTS), 3.13, 3.14. Dropped 3.10
  # (EOL Oct 2026) to save CI minutes; 3.11 is kept
  # since it receives updates until Mar 2027.
  # ──────────────────────────────────────────────
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Test
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # Docker build
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t memos:ci .
      - name: Verify container starts
        run: |
          docker run -d --name memos-test -p 7400:7400 memos:ci
          sleep 5
          curl -f http://localhost:7400/health
          docker stop memos-test
