name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Lockfile drift: fail fast if pnpm-lock.yaml
  # is out of sync with package.json (catches the
  # class of break that previously wasted full runs).
  # ──────────────────────────────────────────────
  verify-lockfile:
    name: Verify lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Verify pnpm-lock.yaml is in sync
        run: |
          # --frozen-lockfile makes pnpm fail (instead of updating) when
          # package.json and pnpm-lock.yaml disagree — the real failure
          # mode. --lockfile-only avoids a full install for this check.
          pnpm install --frozen-lockfile --lockfile-only

  # ──────────────────────────────────────────────
  # One-line installer: exercise scripts/install.sh
  # end to end. Deliberately does NOT set up Node:
  # on ubuntu the runner has no node on PATH, so the
  # script's download-a-Node path is tested; macOS
  # runners ship node, testing the system-node path.
  # ──────────────────────────────────────────────
  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # TEMP DEBUG: don't let the macOS failure cancel the ubuntu probes
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # TEMP DEBUG probes (PAT can't read step logs; step pass/fail is the
      # only observable signal). Remove once the macOS failure is understood.
      - name: probe-1 runner temp writable
        continue-on-error: true
        run: test -n "$RUNNER_TEMP" && test -d "$RUNNER_TEMP"
      - name: probe-2 home override works
        continue-on-error: true
        run: export HOME="$RUNNER_TEMP/fakehome" && mkdir -p "$HOME" && test -d "$HOME"
      - name: probe-3 node usable
        continue-on-error: true
        run: command -v node && node -v
      - name: probe-4 node major >= 20
        continue-on-error: true
        run: test "$(node -v | sed 's/^v//;s/\..*//')" -ge 20
      - name: probe-5 npm usable
        continue-on-error: true
        run: command -v npm && npm -v
      - name: probe-6 install.sh parses under sh
        continue-on-error: true
        run: sh -n scripts/install.sh
      - name: probe-7 install.sh platform stage
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome" && mkdir -p "$HOME"
          # run only the platform-detection head of install.sh
          sed -n '1,/^log "platform/p' scripts/install.sh | sh
      - name: probe-8 install.sh node detection
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome" && mkdir -p "$HOME"
          export MEMOS_HOME="$HOME/.memos"
          sed -n '1,102p' scripts/install.sh | sh
      - name: probe-9 install.sh npm resolution
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome" && mkdir -p "$HOME"
          export MEMOS_HOME="$HOME/.memos"
          sed -n '1,141p' scripts/install.sh | sh
      - name: probe-10 install.sh through mkdir
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome" && mkdir -p "$HOME"
          export MEMOS_HOME="$HOME/.memos"
          sed -n '1,152p' scripts/install.sh | sh
      - name: probe-11 raw npm install
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome" && mkdir -p "$HOME"
          npm install --prefix "$HOME/.memos-probe/pkg" --no-audit --no-fund "@mem-os/sdk@latest"
      # TEMP DEBUG: probe-10 isolated the failure to mkdir -p "$PKG_DIR" "$BIN_DIR"
      - name: probe-12 mkdir single arg
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome" && mkdir -p "$HOME"
          export MEMOS_HOME="$HOME/.memos"
          mkdir -p "$MEMOS_HOME/pkg"
      - name: probe-13 mkdir two args
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome2" && mkdir -p "$HOME"
          export MEMOS_HOME="$HOME/.memos"
          mkdir -p "$MEMOS_HOME/pkg" "$MEMOS_HOME/bin"
      - name: probe-14 log line with ellipsis char
        continue-on-error: true
        run: |
          log() { printf '%s\n' "memos-install: $*"; }
          PKG_DIR="/tmp/x/pkg"
          MEMOS_NPM_TAG="latest"
          log "installing @mem-os/sdk@$MEMOS_NPM_TAG into $PKG_DIR…"
      - name: probe-15 install.sh through npm install line
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome3" && mkdir -p "$HOME"
          export MEMOS_HOME="$HOME/.memos"
          sed -n '1,153p' scripts/install.sh | sh
      - name: probe-16 full install into fresh home
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome16" && mkdir -p "$HOME"
          export MEMOS_HOME="$HOME/.memos"
          sh scripts/install.sh
      - name: probe-20 install.sh through ln -sf
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome20" && mkdir -p "$HOME"
          export MEMOS_HOME="$HOME/.memos"
          sed -n '1,156p' scripts/install.sh | sh
      - name: probe-22 ln -sf with nonexistent source
        run: |
          mkdir -p "$RUNNER_TEMP/lntest/destdir"
          ln -sf "$RUNNER_TEMP/lntest/nonexistent-source" "$RUNNER_TEMP/lntest/destdir/link"
          test -L "$RUNNER_TEMP/lntest/destdir/link"
      - name: probe-23 check .bin/memos after npm install
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome23" && mkdir -p "$HOME"
          export MEMOS_HOME="$HOME/.memos"
          sed -n '1,153p' scripts/install.sh | sh
          test -e "$MEMOS_HOME/pkg/node_modules/.bin/memos"
      - name: probe-24 npm bin-links config
        run: npm config get bin-links
      - name: probe-25a sdk dir exists after install
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome23"
          test -d "$HOME/.memos/pkg/node_modules/@mem-os/sdk"
      - name: probe-25b cli.js exists after install
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome23"
          test -f "$HOME/.memos/pkg/node_modules/@mem-os/sdk/dist/cli.js"
      - name: probe-25c .bin dir exists after install
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome23"
          test -d "$HOME/.memos/pkg/node_modules/.bin"
      - name: Run installer into a temp HOME
        run: |
          export MEMOS_HOME="$RUNNER_TEMP/memos-home"
          sh scripts/install.sh
          test -x "$MEMOS_HOME/bin/memos"
          "$MEMOS_HOME/bin/memos" --help >/dev/null
      - name: probe-19a marker m1 reached
        if: always()
        continue-on-error: true
        run: grep -q "^m1$" "$RUNNER_TEMP/markers.txt"
      - name: probe-19b marker m2 reached
        if: always()
        continue-on-error: true
        run: grep -q "^m2$" "$RUNNER_TEMP/markers.txt"
      - name: probe-19c marker m3 reached
        if: always()
        continue-on-error: true
        run: grep -q "^m3$" "$RUNNER_TEMP/markers.txt"
      - name: probe-19d marker m4 reached
        if: always()
        continue-on-error: true
        run: grep -q "^m4$" "$RUNNER_TEMP/markers.txt"
      - name: probe-19f marker m6 reached
        if: always()
        continue-on-error: true
        run: grep -q "^m6$" "$RUNNER_TEMP/markers.txt"
      - name: probe-19g marker m7 reached
        if: always()
        continue-on-error: true
        run: grep -q "^m7$" "$RUNNER_TEMP/markers.txt"
      - name: probe-19e marker m5 reached
        if: always()
        continue-on-error: true
        run: grep -q "^m5$" "$RUNNER_TEMP/markers.txt"
      - name: probe-17a pkg node_modules exists after Run installer
        if: always()
        continue-on-error: true
        run: test -d "$RUNNER_TEMP/fakehome/.memos/pkg/node_modules"
      - name: probe-17b bin memos exists after Run installer
        if: always()
        continue-on-error: true
        run: test -e "$RUNNER_TEMP/fakehome/.memos/bin/memos"
      - name: probe-18 memos --help in fakehome
        if: always()
        continue-on-error: true
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          export MEMOS_HOME="$HOME/.memos"
          "$MEMOS_HOME/bin/memos" --help >/dev/null
      - name: probe-17c bin memos executable after Run installer
        if: always()
        continue-on-error: true
        run: test -x "$RUNNER_TEMP/fakehome/.memos/bin/memos"
      - name: Re-run is idempotent
        run: |
          export MEMOS_HOME="$RUNNER_TEMP/memos-home"
          sh scripts/install.sh
          "$MEMOS_HOME/bin/memos" --help >/dev/null

  # ──────────────────────────────────────────────
  # TypeScript: Lint + Format + Build + Test
  # Matrix: Node 26 (recommended) plus Node 22 and 24 (LTS) across
  # ubuntu/macOS/windows. Node 20 dropped (EOL Apr 2025).
  # ──────────────────────────────────────────────
  typescript:
    name: TypeScript (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: [verify-lockfile]
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      # NOTE: do NOT cache node_modules itself. pnpm's node_modules is a
      # symlink tree; actions/cache materializes it as real files on
      # restore (notably on Windows), breaking bins like tsc. The
      # setup-node pnpm cache above already keeps installs fast via the
      # content-addressable store.
      - name: Install dependencies
        # --ignore-scripts: better-sqlite3 v13 ships binding.gyp, so the
        # installer auto-detects it as a node-gyp package and runs a pointless
        # `node-gyp rebuild` (its prebuild loads via lib/binding.js, no build
        # needed). The dep sets gypfile:false but the npm lockfile dropped it.
        # On Windows runners with VS 2026 the bundled node-gyp can't detect the
        # toolchain and the install fails. Repo + deps have no install hooks,
        # so ignoring scripts is safe.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: ${{ runner.os }}-huggingface-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Verify plugin manifest versions match the SDK
        run: node scripts/check-plugin-version.mjs
      - name: TypeScript version
        run: pnpm exec tsc --version
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test --ci --coverage

  # ──────────────────────────────────────────────
  # Native deps smoke across major Linux distro
  # families (dnf/apt/pacman). Reduced from 6 to 3
  # to save CI minutes while covering all package
  # manager families.
  # Retrieval regression eval: the golden corpus (scripts/eval/corpus.json)
  # runs through the real hybrid pipeline on the deterministic local-hash
  # embedder; recall@5 / MRR must stay within tolerance of the committed
  # baseline. Catches ranking regressions (fusion, pools, expansion) before
  # they ship.
  retrieval-eval:
    name: Retrieval regression eval
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run retrieval eval against committed baseline
        run: pnpm exec tsx scripts/eval-retrieval.ts --check
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-eval-results
          path: scripts/eval/retrieval-results.json
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  linux-distro-native-smoke:
    name: Native deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            bootstrap: dnf install -y nodejs npm python3 make gcc-c++ && npm install -g pnpm@12.6.0 --ignore-scripts
          - name: Debian
            image: debian:trixie
            # Debian trixie ships Node 20, but better-sqlite3 v13 requires
            # Node >= 22 — install the NodeSource Node 24 LTS instead.
            bootstrap: apt-get update && apt-get install -y curl ca-certificates gnupg && curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && apt-get install -y nodejs python3 make g++ && npm install -g pnpm@12.6.0 --ignore-scripts
          - name: Arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm nodejs npm python base-devel && npm install -g pnpm@12.6.0 --ignore-scripts
    steps:
      - uses: actions/checkout@v7
      - name: Cache pnpm store for in-docker install
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: better-sqlite3 install/build/test smoke
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ runner.temp }}/pnpm-store:/root/.local/share/pnpm/store" \
            -w /repo ${{ matrix.image }} bash -lc '${{ matrix.bootstrap }} && bash /repo/scripts/smoke-native.sh'

  # ──────────────────────────────────────────────
  # Python: Lint + Test
  # Matrix: 3.11, 3.12 (LTS), 3.13, 3.14. Dropped 3.10
  # (EOL Oct 2026) to save CI minutes; 3.11 is kept
  # since it receives updates until Mar 2027.
  # ──────────────────────────────────────────────
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Test
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # Docker build
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t memos:ci .
      - name: Verify container starts
        run: |
          docker run -d --name memos-test -p 7400:7400 memos:ci
          sleep 5
          curl -f http://localhost:7400/health
          docker stop memos-test
