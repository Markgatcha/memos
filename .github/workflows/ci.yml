name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Lockfile drift: fail fast if package-lock.json
  # is out of sync with package.json (catches the
  # class of break that previously wasted full runs).
  # ──────────────────────────────────────────────
  verify-lockfile:
    name: Verify lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Verify package-lock.json is in sync
        run: |
          # Use `npm ci --dry-run` rather than regenerating + diffing the
          # lockfile. It validates that package.json and package-lock.json are
          # in sync (the real failure mode) without byte-comparing the file,
          # so it does not false-positive on npm-version formatting differences
          # between the local machine and the CI runner.
          npm ci --dry-run

  # ──────────────────────────────────────────────
  # TypeScript: Lint + Format + Build + Test
  # Matrix: Node 22 (LTS) + 24 (latest) across
  # ubuntu/macOS/windows. Node 20 dropped (EOL Apr 2025).
  # ──────────────────────────────────────────────
  typescript:
    name: TypeScript (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: [verify-lockfile]
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
      - name: Install dependencies
        run: npm ci
      - name: TypeScript version
        run: npx tsc --version
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --ci --coverage

  # ──────────────────────────────────────────────
  # Native deps smoke across major Linux distro
  # families (dnf/apt/pacman). Reduced from 6 to 3
  # to save CI minutes while covering all package
  # manager families.
  # ──────────────────────────────────────────────
  linux-distro-native-smoke:
    name: Native deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: fedora:latest
            bootstrap: dnf install -y nodejs npm python3 make gcc-c++
          - name: Debian
            image: debian:trixie
            bootstrap: apt-get update && apt-get install -y nodejs npm python3 make g++
          - name: Arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm nodejs npm python base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Cache npm tarballs for in-docker install
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-cache-${{ hashFiles('package-lock.json') }}
      - name: better-sqlite3 install/build/test smoke
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ runner.temp }}/npm:/root/.npm" \
            -w /repo ${{ matrix.image }} bash -lc '${{ matrix.bootstrap }} && bash /repo/scripts/smoke-native.sh'

  # ──────────────────────────────────────────────
  # Python: Lint + Test
  # Matrix: 3.12 (LTS), 3.13, 3.14. Dropped 3.10/3.11
  # to save CI minutes (3.10 EOL Oct 2026, 3.11 EOL
  # Mar 2027).
  # ──────────────────────────────────────────────
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [verify-lockfile]
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Test
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # Docker build
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t memos:ci .
      - name: Verify container starts
        run: |
          docker run -d --name memos-test -p 7400:7400 memos:ci
          sleep 5
          curl -f http://localhost:7400/health
          docker stop memos-test
