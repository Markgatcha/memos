name: Dump code scanning alerts
on:
  push:
    branches: [fix/code-scanning-alerts]
permissions:
  contents: read
  security-events: read
jobs:
  dump:
    runs-on: ubuntu-26.04
    steps:
      - name: Dump alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/code-scanning/alerts?state=open&per_page=100" > /tmp/alerts.json
          wc -c /tmp/alerts.json
          cat /tmp/alerts.json
