name: Release

# Publishes to npm automatically whenever a GitHub Release is published.
# Requires a repository secret NPM_TOKEN (npm automation token with publish rights).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish @mem-os/sdk to npm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript version
        run: pnpm exec tsc --version
      - name: Publish
        # prepublishOnly (clean + build) runs automatically before publish.
        run: pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
