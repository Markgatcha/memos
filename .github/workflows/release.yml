name: Release

# Publishes to npm automatically whenever a GitHub Release is published.
# Requires a repository secret NPM_TOKEN (npm automation token with publish rights).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish @mem-os/sdk to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript version
        run: npx tsc --version
      - name: Publish
        # prepublishOnly (clean + build) runs automatically before publish.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
