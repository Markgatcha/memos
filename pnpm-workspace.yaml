allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  better-sqlite3: false
  better-sqlite3-multiple-ciphers: false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@typescript/typescript-aix-ppc64@7.1.0-beta'
  - '@typescript/typescript-android-arm64@7.1.0-beta'
  - '@typescript/typescript-darwin-x64@7.1.0-beta'
  - '@typescript/typescript-freebsd-arm64@7.1.0-beta'
  - '@typescript/typescript-freebsd-x64@7.1.0-beta'
  - '@typescript/typescript-linux-arm64@7.1.0-beta'
  - '@typescript/typescript-linux-arm@7.1.0-beta'
  - '@typescript/typescript-linux-loong64@7.1.0-beta'
  - '@typescript/typescript-linux-mips64el@7.1.0-beta'
  - '@typescript/typescript-linux-ppc64@7.1.0-beta'
  - '@typescript/typescript-linux-riscv64@7.1.0-beta'
  - '@typescript/typescript-linux-s390x@7.1.0-beta'
  - '@typescript/typescript-linux-x64@7.1.0-beta'
  - '@typescript/typescript-netbsd-arm64@7.1.0-beta'
  - '@typescript/typescript-netbsd-x64@7.1.0-beta'
  - '@typescript/typescript-openbsd-arm64@7.1.0-beta'
  - '@typescript/typescript-openbsd-x64@7.1.0-beta'
  - '@typescript/typescript-sunos-x64@7.1.0-beta'
  - '@typescript/typescript-win32-arm64@7.1.0-beta'
  - '@typescript/typescript-win32-x64@7.1.0-beta'
  - typescript@7.1.0-beta
packageExtensions:
  # @huggingface/transformers imports `onnxruntime-common` without declaring
  # it (a phantom dependency) and pins onnxruntime-node@1.30.0. pnpm hoists
  # whatever onnxruntime-common it sees most often — here 1.14.0, dragged in
  # by the legacy @xenova/transformers peer — so transformers resolves the
  # 1.14.0 CJS bundle instead of the 1.30.0 ESM build its native binding
  # expects. The result is a broken import ("does not provide an export
  # named 'Tensor'") or a Tensor/class mismatch at inference time
  # ("Tensor.location must be a string"), which silently degrades the SDK
  # to its local-hash fallback. Declaring the edge pins transformers to the
  # onnxruntime-common version that matches its own onnxruntime-node.
  '@huggingface/transformers@4.3.1':
    dependencies:
      onnxruntime-common: 1.30.0
