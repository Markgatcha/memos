allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  better-sqlite3: false
  better-sqlite3-multiple-ciphers: false
  esbuild: false
  onnxruntime-node: true
  protobufjs: false
  sharp: true
  unrs-resolver: false
